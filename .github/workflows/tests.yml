name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System libraries (barcode and OCR)
        run: sudo apt-get update && sudo apt-get install -y libzbar0 tesseract-ocr fonts-dejavu-core
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
